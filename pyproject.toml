[project]
name = "heatbrief"
version = "0.1.0"
description = "Evidence-backed temperature comparisons and client briefings over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.12,<3", "tzdata>=2025.2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "reportlab>=4.3,<5"]

[project.scripts]
heatbrief = "heatbrief.cli:main"
heatbrief-mock-mcp = "heatbrief.mock_mcp:main"
heatbrief-agent-mcp = "heatbrief.agent_mcp:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pypdf>=5,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded SVG/HTML templates keep literal markup on single lines.
"scripts/render-preview.py" = ["E501"]
"scripts/record-demo.py" = ["E501"]
