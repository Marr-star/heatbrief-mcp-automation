   }\r\n    ]\r\n  },\r\n  \"output\": \"reports\\\\demo-recording\\\\demo-phoenix-001\"\r\n}\r\n\r\n[exit 0]\r\n"], [45.0, "o", "\u001b[2J\u001b[H3 / Evidence-backed report\r\n\r\n"], [45.0, "o", "# HeatBrief | Temperature comparison\r\n\r\n**Mock data \u2014 fictional demonstration**\r\n\r\nRequest: `demo-phoenix-001` \u00b7 Client: Acme Demo Events \\(fictional\\)\r\nRequested time: 2025-09-20T14:00:00-07:00 (America/Phoenix)\r\n\r\nBusiness question: Which of these three locations has the lowest temperature for our site visit?\r\n\r\n## Finding\r\n\r\nAmong these locations, Tempe Riverside has the lowest temperature at 34\\.1 \u00b0C\\.\r\n\r\nTemperature spread among available readings: 2.6 \u00b0C.\r\nCoverage: 3/3 locations.\r\n\r\n## Evidence\r\n\r\n| Location | Coordinates | Temperature | Observed at | Source / evidence ID |\r\n|---|---|---|---|---|\r\n| Phoenix Civic Plaza | 33.4484, -112.074 | 35.2 \u00b0C | 2025\\-09\\-20T14:00:00\\-07:00 | HeatBrief fictional fixture \u2014 Mock data / mock\\-20250920\\-33\\.4484\\-\\-112\\.074 |\r\n| Tempe Riverside | 33.4255, -111.94 | 34.1 \u00b0C | 2025\\-09\\-20T14:00:00\\-07:00 | HeatBrief fictional fixture \u2014 Mock data / mock\\-20250920\\-33\\.4255\\-\\-111\\.94 |\r\n| Scottsdale Courtyard | 33.4942, -111.9261 | 36.7 \u00b0C | 2025\\-09\\-20T14:00:00\\-07:00 | HeatBrief fictional fixture \u2014 Mock data / mock\\-20250920\\-33\\.4942\\-\\-111\\.9261 |\r\n\r\n## Limitations\r\n\r\n- Mock data: all readings are fictional; live FortyGuard is unverified\\.\r\n- Only temperature is compared; this does not establish safety for outdoor work or events\\.\r\n- Readings apply only to the stated coordinates and timestamp\\.\r\n- Rankings use Celsius rounded to 0\\.001 degrees; displayed values use one decimal\\.\r\n"], [70.0, "o", "\u001b[2J\u001b[H4 / Repeat the request: replay the saved result\r\n\r\n"], [70.0, "o", "$ python -m heatbrief.cli compare examples/request.json --out reports/demo-recording\r\n\r\n"], [73.14 const data=JSON.parse(document.getElementById('recording').textContent);const terminal=document.getElementById('terminal'),play=document.getElementById('play'),progress=document.getElementById('progress');let cursor=0,index=0,running=false,last=0;
function render(){while(index<data.events.length&&data.events[index][0]<=cursor){let text=data.events[index++][2];if(text.includes('\x1b[2J'))terminal.textContent='';terminal.textContent+=text.replace(/\x1b\[[0-9;]*[A-Za-z]/g,'').replace(/\r/g,'');terminal.scrollTop=terminal.scrollHeight;}progress.value=cursor;document.getElementById('time').textContent=Math.floor(cursor/60)+':'+String(Math.floor(cursor%60)).padStart(2,'0')+' / 2:00';}
function frame(now){if(running){cursor=Math.min(data.duration,cursor+(now-last)/1000*Number(document.getElementById('speed').value));render();if(cursor>=data.duration){running=false;play.textContent='Play';}}last=now;requestAnimationFrame(frame);}play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play';};document.getElementById('restart').onclick=()=>{cursor=0;index=0;terminal.textContent='';render();};progress.onclick=e=>{cursor=data.duration*(e.offsetX/progress.clientWidth);index=0;terminal.textContent='';render();};render();requestAnimationFrame(frame);
</script></html>
